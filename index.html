<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel & Evelyn</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="invitation-locked">

    <div class="sparkling-hearts" aria-hidden="true">
        <span class="sparkle-heart sparkle-1">♥</span>
        <span class="sparkle-heart sparkle-2">♥</span>
        <span class="sparkle-heart sparkle-3">♥</span>
        <span class="sparkle-heart sparkle-4">♥</span>
        <span class="sparkle-heart sparkle-5">♥</span>
        <span class="sparkle-heart sparkle-6">♥</span>
        <span class="sparkle-heart sparkle-7">♥</span>
        <span class="sparkle-heart sparkle-8">♥</span>
        <span class="sparkle-heart sparkle-9">♥</span>
        <span class="sparkle-heart sparkle-10">♥</span>
        <span class="sparkle-heart sparkle-11">♥</span>
        <span class="sparkle-heart sparkle-12">♥</span>
        <span class="sparkle-heart sparkle-13">♥</span>
        <span class="sparkle-heart sparkle-14">♥</span>
        <span class="sparkle-heart sparkle-15">♥</span>
    </div>

    <div class="floating-hearts" aria-hidden="true">
        <span class="heart heart-1">♥</span>
        <span class="heart heart-2">♥</span>
        <span class="heart heart-3">♥</span>
        <span class="heart heart-4">♥</span>
        <span class="heart heart-5">♥</span>
        <span class="heart heart-6">♥</span>
        <span class="heart heart-7">♥</span>
        <span class="heart heart-8">♥</span>
        <span class="heart heart-9">♥</span>
        <span class="heart heart-10">♥</span>
        <span class="heart heart-11">♥</span>
        <span class="heart heart-12">♥</span>
        <span class="heart heart-13">♥</span>
        <span class="heart heart-14">♥</span>
    </div>

        <audio id="backgroundMusic" loop preload="auto">
        <source src="music/fonseca.mp3" type="audio/mpeg">
    </audio>

    <button id="musicToggle" class="music-toggle" type="button" aria-label="Apagar música">
        ♪
    </button>

<main class="invitation">

        <section class="landing" id="landing">
            <img
                class="landing-image"
                src="img/boda 1.png"
                alt="Invitación de boda de Samuel y Evelyn"
            >

            <button class="wedding-letter" id="openInvitation" type="button" aria-label="Abrir invitación">
                <img
                    src="img/carta_sello.png"
                    alt="Carta de invitación con sello E&S"
                >
            </button>
        </section>




    

<section class="invitation-page">
            <img src="img/boda 2.png" alt="Invitación de boda - página 2">
        </section>

<section class="invitation-page">
            <img src="img/boda 3.jpeg" alt="Invitación de boda - página 3">
        </section>

<section class="invitation-page countdown-page">
            <img src="img/boda 4.png" alt="Invitación de boda - página 4">

            <div class="countdown" id="countdown">
                <div class="countdown-item">
                    <span id="days">00</span>
                    <small>DÍAS</small>
                </div>

                <div class="countdown-separator">:</div>

                <div class="countdown-item">
                    <span id="hours">00</span>
                    <small>HORAS</small>
                </div>

                <div class="countdown-separator">:</div>

                <div class="countdown-item">
                    <span id="minutes">00</span>
                    <small>MIN</small>
                </div>

                <div class="countdown-separator">:</div>

                <div class="countdown-item">
                    <span id="seconds">00</span>
                    <small>SEG</small>
                </div>
            </div>
        </section>

<section class="invitation-page location-page">
            <img src="img/boda 5.png" alt="Invitación de boda - página 5">

            <a
                class="location-button"
                href="https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=/maps/place/casa%2Bde%2Bmateo%2Bzorritos/data%3D!4m2!3m1!1s0x90340117b88f43fd:0x8309c0c9ddd92187%3Fsa%3DX%26ved%3D1t:242%26ictx%3D111&ved=2ahUKEwjt7p6VzIqXAxXElZUCHWagFyAQ8gF6BAggEAM&usg=AOvVaw3obMiRK777k5qf4lkI94vK"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Ver ubicación en Google Maps"
            >
                <svg class="location-icon" viewBox="0 0 120 150" role="img" aria-label="Ver ubicación en Google Maps">
    <path
        class="location-pin"
        d="M60 5C29.6 5 5 29.6 5 60c0 39.5 55 85 55 85s55-45.5 55-85C115 29.6 90.4 5 60 5Z"
    />
    <circle class="location-circle" cx="60" cy="60" r="31"/>
    <path
        class="location-heart"
        d="M60 78
           C55 73 39 63 39 51
           C39 43.5 44.2 38 50.5 38
           C55 38 58.3 40.7 60 44
           C61.7 40.7 65 38 69.5 38
           C75.8 38 81 43.5 81 51
           C81 63 65 73 60 78Z"
    />
</svg>
            </a>
        </section>

<section class="invitation-page">
            <img src="img/boda 6.png" alt="Invitación de boda - página 6">
        </section>

<section class="invitation-page">
            <img src="img/boda 7.png" alt="Invitación de boda - página 7">
        </section>

<section class="invitation-page qr-page">
            <img src="img/boda 8.png" alt="Invitación de boda - página 8">

            <div class="qr-button" aria-label="Código QR para confirmar asistencia">
                <img src="img/qr_form.jpeg" alt="Código QR para confirmar asistencia">
            </div>
        </section>

<section class="invitation-page">
            <img src="img/boda 9.png" alt="Invitación de boda - página 9">
        </section>
</main>

    <script src="js/app.js"></script>
</body>
</html>
